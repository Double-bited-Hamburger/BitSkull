<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BitSkull</title>
  <defs>
    <!-- Skull silhouette: one path, holes cut with even-odd so glitch ghosts show through -->
    <path id="sk" fill-rule="evenodd" d="
      M84 30 L172 30 L206 56 L218 96 L216 134 L201 152 L197 174 L177 184 L79 184 L59 174 L55 152 L40 134 L38 96 L50 56 Z
      M140 30 L147 30 L140 48 L148 61 L141 77 L137 76 L143 61 L134 48 Z
      M64 102 L104 96 L115 111 L109 135 L84 141 L67 128 Z
      M192 102 L152 96 L141 111 L147 135 L172 141 L189 128 Z
      M128 142 L117 163 L125 166 L128 159 L131 166 L139 163 Z
      M90 165 H166 V167.5 H90 Z
      M101 169 h3.5 v15 h-3.5 Z M114 169 h3.5 v15 h-3.5 Z M126.25 169 h3.5 v15 h-3.5 Z M138.5 169 h3.5 v15 h-3.5 Z M151.5 169 h3.5 v15 h-3.5 Z
      M58 180 L64 179 L78 203 L72 206 Z
      M198 180 L192 179 L178 203 L184 206 Z
      M74 206 L182 206 L179 224 L161 242 L95 242 L77 224 Z
      M101 206 h3.5 v14 h-3.5 Z M114 206 h3.5 v14 h-3.5 Z M126.25 206 h3.5 v14 h-3.5 Z M138.5 206 h3.5 v14 h-3.5 Z M151.5 206 h3.5 v14 h-3.5 Z
      M90 222.5 H166 V225 H90 Z"/>
    <clipPath id="skClip"><use href="#sk" clip-rule="evenodd"/></clipPath>
    <pattern id="dA" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#0b0b10"/><rect x="2" y="2" width="2" height="2" fill="#0b0b10"/>
    </pattern>
    <pattern id="dB" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#0b0b10"/>
    </pattern>
    <g id="art">
      <use href="#sk" fill="#ecefe6"/>
      <g clip-path="url(#skClip)">
        <path d="M172 30 L206 56 L218 96 L216 134 L201 152 L197 174 L177 184 L150 184 L170 132 L178 84 Z" fill="url(#dB)"/>
        <path d="M206 56 L218 96 L216 134 L201 152 L197 174 L177 184 L168 184 L186 128 L192 82 Z" fill="url(#dA)"/>
        <path d="M74 206 L182 206 L179 224 L161 242 L95 242 L77 224 Z" fill="url(#dB)" opacity=".9"/>
      </g>
      <rect x="158" y="108" width="11" height="11" fill="#c6ff3d"/>
      <rect x="171" y="112" width="4" height="4" fill="#c6ff3d"/>
      <rect x="153" y="122" width="4" height="4" fill="#c6ff3d"/>
      <rect x="162" y="123" width="3" height="3" fill="#c6ff3d" opacity=".6"/>
    </g>
    <clipPath id="band1"><rect x="0" y="104" width="256" height="14"/></clipPath>
    <clipPath id="band2"><rect x="0" y="150" width="256" height="6"/></clipPath>
    <clipPath id="rest"><path d="M0 0 H256 V104 H0 Z M0 118 H256 V150 H0 Z M0 156 H256 V256 H0 Z"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0b0b10"/>
  <g opacity=".35" fill="#c6ff3d">
    <rect x="24" y="226" width="6" height="2"/><rect x="34" y="226" width="14" height="2"/><rect x="214" y="30" width="18" height="2"/><rect x="222" y="36" width="10" height="2"/>
  </g>
  <g clip-path="url(#rest)">
    <use href="#sk" fill="#ff2bd6" transform="translate(-3 0)" opacity=".9"/>
    <use href="#sk" fill="#00e5ff" transform="translate(3 0)" opacity=".9"/>
    <use href="#art"/>
  </g>
  <g clip-path="url(#band1)" transform="translate(10 0)">
    <use href="#sk" fill="#ff2bd6" transform="translate(-5 0)"/>
    <use href="#sk" fill="#00e5ff" transform="translate(5 0)"/>
    <use href="#art"/>
  </g>
  <g clip-path="url(#band2)" transform="translate(-7 0)">
    <use href="#sk" fill="#00e5ff" transform="translate(-4 0)"/>
    <use href="#art"/>
  </g>
</svg>
